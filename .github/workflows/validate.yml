name: Validate EOL Data

on:
  push:
    paths:
      - 'data/eol.json'
      - 'data/schema.json'
  pull_request:
    paths:
      - 'data/eol.json'
      - 'data/schema.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate JSON syntax
        run: python -c "import json; json.load(open('data/eol.json'))"

      - name: Validate against schema
        run: |
          python -c "
          import json
          from jsonschema import Draft7Validator

          with open('data/schema.json') as f:
              schema = json.load(f)
          with open('data/eol.json') as f:
              data = json.load(f)

          errs = sorted(Draft7Validator(schema).iter_errors(data), key=lambda e: list(e.path))
          if errs:
              print(f'Schema validation FAILED with {len(errs)} error(s):')
              for e in errs[:50]:
                  print(f'  - {\"/\".join(str(p) for p in e.path) or \"<root>\"}: {e.message}')
              exit(1)
          print(f'Schema validation PASSED ({len(data[\"entries\"])} entries)')
          "

      - name: Check date coherence and event structure
        run: |
          python -c "
          import json
          from datetime import datetime

          with open('data/eol.json') as f:
              data = json.load(f)

          def computed_status(events, today):
              d = {e['lifecycleEventType']: e['date'] for e in events if e.get('date')}
              se = d.get('STANDARD_SUPPORT_END') or d.get('END_OF_SUPPORT')
              ee = d.get('EXTENDED_SUPPORT_END')
              eol = d.get('END_OF_LIFE')
              if eol and today >= eol: return 'END_OF_LIFE'
              if ee:
                  if today >= ee: return 'END_OF_LIFE'
                  if se and today >= se: return 'EXTENDED_SUPPORT'
                  return 'STANDARD_SUPPORT'
              if se and today >= se: return 'DEPRECATED'
              return 'STANDARD_SUPPORT'

          today = datetime.now().strftime('%Y-%m-%d')
          errors, warnings = [], []
          for e in data['entries']:
              vid = f\"{e['serviceCode']}/{e.get('engine')}/{e.get('versionNumber')}\"
              dates = {}
              for ev in e.get('lifecycleEvents', []):
                  d = ev.get('date')
                  if d is None:
                      continue
                  try:
                      datetime.strptime(d, '%Y-%m-%d')
                  except ValueError:
                      errors.append(f'{vid}: non-ISO date {d!r} on {ev[\"lifecycleEventType\"]}')
                      continue
                  dates[ev['lifecycleEventType']] = d
              se = dates.get('STANDARD_SUPPORT_END') or dates.get('END_OF_SUPPORT')
              ee = dates.get('EXTENDED_SUPPORT_END')
              if se and ee and se > ee:
                  errors.append(f'{vid}: standard-support end {se} is after extended-support end {ee}')
              # status is a build-time snapshot; a drift to current date is a freshness signal, not a hard failure
              exp = computed_status(e.get('lifecycleEvents', []), today)
              if e.get('status') != exp:
                  warnings.append(f'{vid}: stored status {e.get(\"status\")} != status computed today ({exp}) - dataset may be stale')

          for w in warnings:
              print('warning:', w)
          if errors:
              print(f'Date coherence FAILED with {len(errors)} error(s):')
              for er in errors:
                  print(f'  - {er}')
              exit(1)
          print(f'Date coherence PASSED ({len(data[\"entries\"])} entries, {len(warnings)} staleness warning(s))')
          "

      - name: Check freshness
        run: |
          python -c "
          import json
          from datetime import datetime

          with open('data/eol.json') as f:
              data = json.load(f)
          checked = data.get('generatedAt') or data['lastUpdated']
          age = (datetime.now() - datetime.strptime(checked, '%Y-%m-%d')).days
          if age > 30:
              print(f'WARNING: dataset last checked {age} days ago (generatedAt {checked}). Consider refreshing.')
          else:
              print(f'Freshness PASSED (generatedAt {checked}, {age} days ago; data last changed {data[\"lastUpdated\"]})')
          "
