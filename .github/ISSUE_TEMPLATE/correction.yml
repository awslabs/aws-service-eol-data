name: Lifecycle correction
description: Report a date, status, or citation that looks wrong
title: "[correction]: "
labels: ["correction"]
body:
  - type: input
    id: entry
    attributes:
      label: Which entry
      description: serviceCode / engine / version, as they appear in data/eol.json (engine can be null)
      placeholder: "docdb / null / 3.6"
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Which field
      placeholder: "the date of a lifecycleEvents event (for example STANDARD_SUPPORT_END), status, a behavior outcome, or a sourceUrl"
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current value in the dataset
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: Correct value
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official AWS source URL
      description: Link to the AWS documentation that supports the correct value
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
